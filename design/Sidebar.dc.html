<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./settings-store.js"></script>
</helmet>
<aside style="background:#fff;border-left:1px solid #EAECEF;display:flex;flex-direction:column;padding:22px 16px;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto">
  <div style="display:flex;align-items:center;gap:12px;padding:2px 8px 4px;flex:0 0 auto">
    <img src="assets/logo.png" alt="دست یاری" style="width:62px;height:62px;object-fit:contain;mix-blend-mode:multiply" />
    <div style="display:flex;flex-direction:column;gap:2px">
      <div style="font-size:16px;font-weight:800;letter-spacing:-.3px">دست یاری</div>
      <div style="font-size:11.5px;color:#9AA0A8">پنل مدیریت</div>
    </div>
  </div>

  <nav style="display:flex;flex-direction:column;gap:3px;flex:0 0 auto">
    <sc-for list="{{ items }}" as="i" hint-placeholder-count="11">
      <div style="display:flex;flex-direction:column;gap:2px">
        <div onClick="{{ i.onClick }}" style="{{ i.style }}">
          <span style="width:20px;text-align:center">{{ i.icon }}</span>{{ i.label }}
          <span style="{{ i.badgeStyle }}">{{ i.badge }}</span>
        </div>
        <sc-for list="{{ i.children }}" as="s" hint-placeholder-count="0">
          <div onClick="{{ s.onClick }}" style="{{ s.style }}">{{ s.label }}</div>
        </sc-for>
      </div>
    </sc-for>
  </nav>

  <div style="margin-top:auto;flex:0 0 auto;display:flex;flex-direction:column;gap:12px">
    <div style="background:#1B1E23;border-radius:16px;padding:16px;color:#fff">
      <div style="font-size:13px;font-weight:700;margin-bottom:6px">تراز صندوق</div>
      <div style="font-size:20px;font-weight:800;color:#FFA51F">۴۱۲٫۵ م<span style="font-size:12px;font-weight:500;color:rgba(255,255,255,.5)"> تومان</span></div>
      <div style="font-size:11.5px;color:rgba(255,255,255,.5);margin-top:6px">تعهد پرداخت‌نشده: ۳۱۸ م</div>
    </div>
    <div onClick="{{ onLogout }}" style="display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;color:#8A9099;font-size:13.5px;cursor:pointer" style-hover="background:#F5F6F8;color:#D63A3F">
      <span style="width:20px;text-align:center">⏻</span>خروج از حساب
    </div>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;dash&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;go&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(key: string) =&gt; void&quot;},&quot;onLogout&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || 'dash';
    const go = this.props.go || (() => {});
    const defs = [
      { group: 'اصلی' },
      { key: 'dash', icon: '▣', label: 'داشبورد' },
      { key: 'mytasks', icon: '☑', label: 'وظایف من', badge: '۶', hot: true },
      { key: 'intake', icon: '⇥', label: 'درخواست‌های کاربران', badge: '۹', hot: true },
      { key: 'list', icon: '♡', label: 'نیازمندان', badge: '۱۲۴۰' },
      { key: 'queue', icon: '◷', label: 'صف فعال‌سازی', badge: '۲۴', hot: true },
      { key: 'reassign', icon: '⇄', label: 'تعیین تکلیف و جایگزینی', badge: '۳', hot: true },
      { key: 'donors', icon: '◍', label: 'کمک‌کنندگان (خیرین)' },
      { key: 'supporters', icon: '★', label: 'پشتیبانان / بلاگرها' },
      { key: 'overdue', icon: '⚑', label: 'پیگیری معوقات', badge: '۱۸', hot: true },
      { key: 'payments', icon: '⇄', label: 'پرداخت‌ها و تراکنش‌ها', badge: '۷', hot: true },
      { key: 'campaigns', icon: '◈', label: 'کمپین‌ها' },
      { key: 'news', icon: '❐', label: 'اخبار و مقالات', badge: '۳' },
      { key: 'broadcast', icon: '⌾', label: 'اطلاع‌رسانی گروهی' },
      { key: 'fund', icon: '⛁', label: 'صندوق هزینه‌های جاری' },
      { group: 'مدیریت' },
      { key: 'reports', icon: '▤', label: 'گزارش‌ها' },
      { key: 'tickets', icon: '✉', label: 'پیام‌ها / تیکت', badge: '۷' },
      { key: 'users', icon: '☷', label: 'کاربران پنل' },
      { key: 'tasks', icon: '⌗', label: 'وظایف کارمندان' },
      { key: 'sms', icon: '✆', label: 'آرشیو پیامک‌ها' },
      { key: 'logs', icon: '⧖', label: 'لاگ فعالیت‌ها' },
      { key: 'settings', icon: '⚙', label: 'تنظیمات' }
    ];
    const meta = {};
    defs.filter(d => !d.group).forEach(d => { meta[d.key] = d; });
    const fromSettings = window.DY ? window.DY.menu('admin') : null;
    const list = (fromSettings && fromSettings.length)
      ? fromSettings.map(m => Object.assign({}, meta[m.id] || {}, { key: m.id, label: m.label, icon: m.icon || (meta[m.id] || {}).icon || '•', children: m.children || [] }))
      : defs.filter(d => !d.group);
    return {
      onLogout: this.props.onLogout || (() => {}),
      items: list.map(d => {
        const on = d.key === active;
        return {
          icon: d.icon, label: d.label, badge: d.badge || '',
          onClick: () => go(d.key),
          children: (d.children || []).map(s => ({
            label: s.label,
            onClick: () => { const k = String(s.link || '').replace(/^#/, ''); if (k) go(k); },
            style: 'display:flex;align-items:center;padding:8px 12px 8px 40px;margin-inline-start:20px;border-radius:10px;font-size:12.5px;color:#787F88;cursor:pointer'
          })),
          style: 'display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;font-size:14px;cursor:pointer;transition:background .12s;'
            + (on ? 'background:#FEF1EC;color:#D8420F;font-weight:700' : 'color:#4E555E'),
          badgeStyle: d.badge
            ? 'margin-right:auto;font-size:11.5px;padding:2px 8px;border-radius:20px;'
              + (d.hot ? 'background:#FDECEC;color:#D63A3F' : 'background:#F1F2F4;color:#6B7280')
            : 'display:none'
        };
      })
    };
  }
}
</script>
</body>
</html>
