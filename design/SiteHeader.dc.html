<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./settings-store.js"></script>
<style>
  .om-sh-burger{display:none}
  @media (max-width:900px){
    .om-sh-nav{display:none !important}
    .om-sh-burger{display:flex !important}
    .om-sh-top > span{display:none}
    .om-sh-cta{gap:8px !important}
    .om-sh-cta > a:first-child{display:none}
  }
  @media (max-width:560px){
    .om-sh-cta > a{padding:0 14px !important;font-size:13px !important}
  }
</style>
</helmet>
<div dir="rtl" style="position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #EFF0F2;font-family:Vazirmatn,system-ui,sans-serif">
  <sc-if value="{{ noticeBar }}" hint-placeholder-val="{{ false }}">
    <div style="{{ noticeBarStyle }}">
      <div style="max-width:1240px;margin-inline:auto;padding:11px clamp(14px,3vw,24px);display:flex;align-items:center;gap:11px;flex-wrap:wrap">
        <span style="{{ noticeIconStyle }}">{{ noticeIcon }}</span>
        <span style="font-size:13.5px;font-weight:800;white-space:nowrap">{{ noticeTitle }}</span>
        <span style="font-size:12.5px;line-height:1.9;opacity:.85;min-width:0">{{ noticeText }}</span>
        <sc-if value="{{ noticeHasWindow }}" hint-placeholder-val="{{ false }}">
          <span style="{{ noticeChipStyle }}">{{ noticeWindow }}</span>
        </sc-if>
        <sc-if value="{{ noticeHasCta }}" hint-placeholder-val="{{ false }}">
          <a href="{{ noticeCtaLink }}" style="{{ noticeCtaStyle }}">{{ noticeCta }}</a>
        </sc-if>
        <sc-if value="{{ noticeDismissible }}" hint-placeholder-val="{{ false }}">
          <span onClick="{{ dismissNotice }}" style="margin-inline-start:auto;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;opacity:.6">✕</span>
        </sc-if>
      </div>
    </div>
  </sc-if>
  <div style="background:#15181D;color:#fff">
    <div class="om-sh-top" style="max-width:1240px;margin-inline:auto;padding:8px clamp(14px,3vw,24px);min-height:42px;display:flex;align-items:center;flex-wrap:wrap;gap:16px">
      <a href="{{ topPhoneHref }}" style="display:flex;align-items:center;gap:8px;color:#fff;font-size:12.5px;font-weight:700;text-decoration:none"><span style="color:#FF7A45">✆</span>{{ topPhone }}</a>
      <span style="font-size:12px;color:rgba(255,255,255,.45)">{{ topNote }}</span>
      <div style="margin-inline-start:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <a href="{{ topLink1Href }}" style="height:32px;padding:0 13px;border-radius:10px;border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;color:#fff;font-size:12px;font-weight:700;text-decoration:none">{{ topLink1 }}</a>
        <a href="{{ topLink2Href }}" style="height:32px;padding:0 13px;border-radius:10px;border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;color:#fff;font-size:12px;font-weight:700;text-decoration:none">{{ topLink2 }}</a>
      </div>
    </div>
  </div>
  <div style="max-width:1240px;margin-inline:auto;padding:10px clamp(14px,3vw,24px);min-height:70px;display:flex;align-items:center;flex-wrap:wrap;gap:12px">
    <a href="{{ homeHref }}" style="display:flex;align-items:center">
      <img src="{{ logo }}" alt="{{ logoAlt }}" style="{{ logoStyle }}" />
    </a>
    <nav class="om-sh-nav" style="display:flex;gap:2px;flex-wrap:wrap;margin-inline-start:10px">
      <sc-for list="{{ items }}" as="i" hint-placeholder-count="5">
        <div style="position:relative;display:flex" onMouseEnter="{{ i.onEnter }}" onMouseLeave="{{ i.onLeave }}">
          <a href="{{ i.href }}" style="{{ i.style }}">{{ i.label }}<span style="font-size:8px;margin-inline-start:6px;opacity:.55">{{ i.caret }}</span></a>
          <sc-if value="{{ i.open }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute;top:100%;right:0;z-index:70;min-width:220px;background:#fff;border:1px solid #EAECEF;border-radius:16px;box-shadow:0 24px 50px -24px rgba(20,22,26,.4);padding:7px;display:flex;flex-direction:column;gap:2px">
              <sc-for list="{{ i.children }}" as="s" hint-placeholder-count="0">
                <a href="{{ s.href }}" style="{{ s.style }}" style-hover="background:#F5F6F8">{{ s.label }}</a>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </nav>
    <div class="om-sh-burger" onClick="{{ toggleMenu }}" style="width:44px;height:44px;border-radius:13px;border:1.5px solid #E3E6EA;align-items:center;justify-content:center;font-size:18px;color:#23262B;cursor:pointer">☰</div>
    <div class="om-sh-cta" style="margin-inline-start:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <a href="{{ cta1Href }}" style="height:44px;padding:0 15px;border:1.5px solid #E3E6EA;border-radius:13px;display:flex;align-items:center;font-size:13.5px;font-weight:700;color:#23262B;white-space:nowrap;text-decoration:none">{{ cta1 }}</a>
      <a href="{{ cta2Href }}" style="height:44px;padding:0 20px;border-radius:13px;display:flex;align-items:center;background:#F4511E;color:#fff;font-size:14px;font-weight:800;white-space:nowrap;text-decoration:none">{{ cta2 }}</a>
    </div>
  </div>

  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeMenu }}" style="position:fixed;inset:0;z-index:60;background:rgba(15,17,20,.55)"></div>
    <div style="position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(300px,86vw);background:#fff;box-shadow:0 0 60px -18px rgba(0,0,0,.45);display:flex;flex-direction:column;padding:16px 14px;gap:14px;overflow-y:auto">
      <div style="display:flex;align-items:center;gap:10px">
        <img src="assets/logo-t.png" alt="دست یاری" style="height:46px;width:auto;object-fit:contain" />
        <div onClick="{{ closeMenu }}" style="margin-inline-start:auto;width:36px;height:36px;border-radius:11px;border:1px solid #EDEEF1;display:flex;align-items:center;justify-content:center;color:#5A6169;cursor:pointer">✕</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <sc-for list="{{ menuItems }}" as="m" hint-placeholder-count="6">
          <div style="display:flex;flex-direction:column;gap:2px">
            <a href="{{ m.href }}" style="{{ m.style }}">{{ m.label }}</a>
            <sc-for list="{{ m.children }}" as="s" hint-placeholder-count="0">
              <a href="{{ s.href }}" style="{{ s.style }}">↳ {{ s.label }}</a>
            </sc-for>
          </div>
        </sc-for>
      </div>
      <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px;border-top:1px solid #F0F1F3;padding-top:12px">
        <a href="پنل خیرین دست یاری.dc.html" style="display:flex;align-items:center;justify-content:center;height:46px;border:1.5px solid #E3E6EA;border-radius:13px;font-size:13.5px;font-weight:700;color:#23262B;text-decoration:none">پنل خیرین</a>
        <a href="ثبت درخواست کمک.dc.html" style="display:flex;align-items:center;justify-content:center;height:46px;border-radius:13px;background:#15181D;color:#fff;font-size:13.5px;font-weight:700;text-decoration:none">درخواست کمک</a>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;cases&quot;,&quot;groups&quot;,&quot;about&quot;,&quot;finance&quot;,&quot;terms&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    const bind = () => {
      if (!window.DY) return false;
      this.offDY = window.DY.onChange(() => this.setState({ dyRev: (this.state.dyRev || 0) + 1 }));
      this.setState({ dyRev: (this.state.dyRev || 0) + 1 });
      return true;
    };
    this.applyMeta();
    if (!bind()) {
      let n = 0;
      this.poll = setInterval(() => { n += 1; if (bind() || n > 40) clearInterval(this.poll); }, 50);
    }
  }

  componentWillUnmount() { clearInterval(this.poll); if (this.offDY) this.offDY(); }

  applyMeta() {
    if (!window.DY || !window.DY.page) return;
    let file = '';
    try { file = decodeURIComponent((window.location.pathname || '').split('/').pop() || ''); } catch (e) {}
    const p = window.DY.page(file);
    const seo = window.DY.seo();
    if (!p) return;
    if (p.title) document.title = p.title;
    const setMeta = (name, content) => {
      if (!content) return;
      let el = document.querySelector('meta[name="' + name + '"]');
      if (!el) { el = document.createElement('meta'); el.setAttribute('name', name); document.head.appendChild(el); }
      el.setAttribute('content', content);
    };
    setMeta('description', p.desc || seo.defaultDesc);
    setMeta('keywords', p.keywords);
    if (p.noindex) setMeta('robots', 'noindex,nofollow');
    const br = window.DY.branding();
    if (br.favicon) {
      let ic = document.querySelector('link[rel="icon"]');
      if (!ic) { ic = document.createElement('link'); ic.setAttribute('rel', 'icon'); document.head.appendChild(ic); }
      ic.setAttribute('href', br.favicon);
    }
    if (br.themeColor) setMeta('theme-color', br.themeColor);
    if (br.ogImage) {
      let og = document.querySelector('meta[property="og:image"]');
      if (!og) { og = document.createElement('meta'); og.setAttribute('property', 'og:image'); document.head.appendChild(og); }
      og.setAttribute('content', br.ogImage);
    }
  }

  renderVals() {
    const active = this.props.active || 'home';
    const fallback = [
      { id: 'home', label: 'صفحه اصلی', link: 'سایت دست یاری.dc.html', children: [] },
      { id: 'cases', label: 'پرونده‌ها', link: 'پروندهها.dc.html', children: [] },
      { id: 'groups', label: 'گروه‌های کمک', link: 'پرونده های گروه.dc.html', children: [] },
      { id: 'campaigns', label: 'کمپین‌ها', link: 'کمپین ها.dc.html', children: [] },
      { id: 'about', label: 'درباره ما', link: 'درباره ما.dc.html', children: [] },
      { id: 'finance', label: 'شفافیت مالی', link: 'شفافیت مالی.dc.html', children: [] },
      { id: 'terms', label: 'قوانین', link: 'قوانین و حریم خصوصی.dc.html', children: [] }
    ];
    const fromSet = window.DY ? window.DY.menu('site') : null;
    const defs = (fromSet && fromSet.length) ? fromSet : fallback;
    const openId = this.state.openId;
    const here = (() => {
      try { return decodeURIComponent((window.location.pathname || '').split('/').pop() || ''); } catch (e) { return ''; }
    })();
    const same = (link) => {
      if (!link || !here) return false;
      const l = String(link).split('#')[0];
      return !!l && l === here;
    };
    const isOn = (d) => d.id === active || same(d.link) || (d.children || []).some(s => same(s.link));
    const br = window.DY ? window.DY.branding() : {};
    const hd = window.DY ? window.DY.header() : {};
    const nt = window.DY ? window.DY.notice() : {};
    const tones = {
      warn: { bg: '#FEF3E7', bd: '#F6D9B4', fg: '#8A4B08', icon: '⚠', chip: 'rgba(138,75,8,.1)' },
      info: { bg: '#EAF2FE', bd: '#C9DDF8', fg: '#144A9C', icon: '◈', chip: 'rgba(20,74,156,.1)' },
      danger: { bg: '#15181D', bd: '#2A2E35', fg: '#fff', icon: '⛔', chip: 'rgba(255,255,255,.12)' }
    };
    const tn = tones[nt.tone] || tones.warn;
    const win = (nt.from && nt.to) ? ('از ' + nt.from + ' تا ' + nt.to + (nt.dateNote ? ' — ' + nt.dateNote : '')) : '';
    /* نوار اطلاعیه در هر دو حالت (نوار و تمام‌صفحه) نمایش داده می‌شود */
    const visible = !!nt.active && !this.state.noticeHidden;
    return {
      noticeBar: visible,
      noticeBarStyle: 'background:' + tn.bg + ';color:' + tn.fg + ';border-bottom:1px solid ' + tn.bd,
      noticeIcon: tn.icon,
      noticeIconStyle: 'flex:0 0 28px;width:28px;height:28px;border-radius:9px;background:' + tn.chip + ';display:flex;align-items:center;justify-content:center;font-size:14px',
      noticeTitle: nt.title || '',
      noticeText: nt.text || '',
      noticeHasWindow: !!win,
      noticeWindow: win,
      noticeChipStyle: 'font-size:12px;font-weight:800;padding:5px 11px;border-radius:20px;background:' + tn.chip + ';white-space:nowrap;direction:rtl',
      noticeHasCta: !!(nt.cta && nt.ctaLink),
      noticeCta: nt.cta, noticeCtaLink: nt.ctaLink || '#',
      noticeCtaStyle: 'height:32px;padding:0 13px;border-radius:10px;border:1.5px solid currentColor;display:flex;align-items:center;font-size:12.5px;font-weight:800;color:inherit;text-decoration:none;white-space:nowrap',
      noticeDismissible: visible && nt.dismissible !== false,
      dismissNotice: () => this.setState({ noticeHidden: true }),
      logo: br.logo || 'assets/logo-t.png',
      logoAlt: br.logoAlt || 'دست یاری',
      logoStyle: 'height:clamp(' + (br.logoHeightMobile || 52) + 'px,7vw,' + (br.logoHeightDesktop || 74) + 'px);width:auto;object-fit:contain;display:block',
      topPhone: hd.topPhone || '', topPhoneHref: hd.topPhoneHref || '#',
      topNote: hd.topNote || '',
      topLink1: hd.topLink1 || '', topLink1Href: hd.topLink1Href || '#',
      topLink2: hd.topLink2 || '', topLink2Href: hd.topLink2Href || '#',
      cta1: hd.cta1 || '', cta1Href: hd.cta1Href || '#',
      cta2: hd.cta2 || '', cta2Href: hd.cta2Href || '#',
      homeHref: hd.homeHref || 'سایت دست یاری.dc.html',
      menuOpen: !!this.state.menuOpen,
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),
      closeMenu: () => this.setState({ menuOpen: false }),
      menuItems: defs.map(d => ({
        label: d.label, href: d.link,
        children: (d.children || []).map(s => ({
          label: s.label, href: s.link,
          style: 'display:flex;align-items:center;padding:9px 12px;margin-inline-start:16px;border-radius:10px;font-size:12.5px;font-weight:700;text-decoration:none;'
            + (same(s.link) ? 'background:#FEF1EC;color:#D8420F' : 'color:#787F88')
        })),
        style: 'display:flex;align-items:center;padding:12px 13px;border-radius:12px;font-size:14px;font-weight:700;text-decoration:none;'
          + (isOn(d) ? 'background:#FEF1EC;color:#D8420F' : 'color:#3A4048')
      })),
      items: defs.map(d => {
        const on = isOn(d);
        const kids = (d.children || []).map(s => ({
          label: s.label, href: s.link,
          style: 'display:flex;align-items:center;gap:8px;padding:10px 11px;border-radius:11px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;'
            + (same(s.link) ? 'background:#FEF1EC;color:#D8420F' : 'color:#3A4048')
        }));
        return {
          label: d.label, href: d.link, children: kids,
          open: kids.length > 0 && openId === d.id,
          onEnter: () => { if (kids.length) this.setState({ openId: d.id }); },
          onLeave: () => { if (openId === d.id) this.setState({ openId: null }); },
          caret: kids.length ? '▾' : '',
          style: 'display:flex;align-items:center;padding:10px 13px;border-radius:11px;font-size:13.5px;font-weight:' + (on ? '800' : '700')
            + ';white-space:nowrap;text-decoration:none;'
            + (on ? 'background:#FEF1EC;color:#D8420F' : 'color:#4E555E')
        };
      })
    };
  }
}
</script>
</body>
</html>
